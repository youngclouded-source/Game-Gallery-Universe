
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sonic the Hedgehog Gallery</title>

    <link rel="stylesheet" href="gallery.css">

    <style>
        body {
            background: #111;
            color: white;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: #181818;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .navbar a:hover,
        .navbar a.active {
            background: #087bd3;
        }

        header {
            text-align: center;
            padding: 30px 15px;
        }

        .gallery {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            padding: 24px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: #202020;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0,0,0,.35);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.04);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            padding: 12px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .card-info {
            padding: 10px 14px 16px;
        }

        .card-info h2 {
            margin: 6px 0;
        }

        .card-info p {
            color: #ccc;
        }
    </style>
</head>

<body data-series="sonic">

    <nav class="navbar">

        <a href="Metroid.html">Metroid</a>

        <a href="DonkeyKong.html">Donkey Kong</a>

    </nav>


    <!-- PAGE HEADER -->
    <header>
        <h1>⚡ Sonic the Hedgehog Gallery</h1>

        <p>
            Explore Sonic, his friends, and their video games!
        </p>
    </header>


    <!-- CHARACTER GALLERY -->
    <main>

        <div id="gallery" class="gallery"></div>

    </main>


    <!-- JAVASCRIPT -->
    <script src="gallery.js" defer></script>

</body>

</html>
